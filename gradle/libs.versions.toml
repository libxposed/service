[versions]
agp = "9.1.1"
dokka = "2.2.0"

[plugins]
agp-lib = { id = "com.android.library", version.ref = "agp" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version = "1.10.0" }
libxposed-annotation = { module = "io.github.libxposed:annotations", version = "1.0.0" }
libxposed-lint = { module = "io.github.libxposed:lint", version = "1.0.0" }
